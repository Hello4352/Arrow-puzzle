<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrow Puzzle</title>

<style>
body {
    margin: 0;
    font-family: 'Pretendard', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* 앱 카드 */
.app {
    background: white;
    width: 320px;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

/* 제목 */
.title {
    font-size: 22px;
    font-weight: bold;
}

/* 상태 표시 */
.status {
    font-size: 14px;
    color: gray;
    margin: 10px 0;
}

/* 그리드 */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 15px 0;
}

/* 버튼 */
.cell {
    aspect-ratio: 1;
    border-radius: 15px;
    border: none;
    font-size: 22px;
    font-weight: bold;
    background: #f1f3f5;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s ease;
}

.cell:active {
    transform: scale(0.9);
}

/* 완료 상태 */
.win {
    background: #4caf50;
    color: white;
}

/* 버튼 영역 */
.controls {
    display: flex;
    gap: 10px;
}

.btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    cursor: pointer;
}

.reset {
    background: #ff6b6b;
    color: white;
}

.shuffle {
    background: #4dabf7;
    color: white;
}

/* 애니메이션 */
.rotate {
    animation: rotateAnim 0.3s ease;
}

@keyframes rotateAnim {
    from { transform: rotate(0deg); }
    to { transform: rotate(90deg); }
}
</style>
</head>

<body>

<div class="app">
    <div class="title">🏹 Arrow Puzzle</div>
    <div class="status" id="status">모든 화살표를 →로 만드세요</div>

    <div class="grid" id="grid"></div>

    <div class="controls">
        <button class="btn reset" onclick="resetGame()">리셋</button>
        <button class="btn shuffle" onclick="shuffle()">랜덤</button>
    </div>
</div>

<script>
let board = [
    '↓','→','←',
    '↑','↓','←',
    '→','↑','←'
];

const rotations = ['↑','→','↓','←'];

function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    board.forEach((arrow, i) => {
        const btn = document.createElement("button");
        btn.className = "cell";
        btn.innerText = arrow;

        if (arrow === '→') btn.classList.add("win");

        btn.onclick = () => handleClick(i, btn);

        grid.appendChild(btn);
    });
}

function getPath(start) {
    let path = [];
    let current = start;

    while (!path.includes(current)) {
        path.push(current);

        let dir = board[current];
        let next = current;

        if (dir === '↑') next = current - 3;
        if (dir === '→') next = current + 1;
        if (dir === '↓') next = current + 3;
        if (dir === '←') next = current - 1;

        if (next < 0 || next >= 9) break;
        if (dir === '→' && current % 3 === 2) break;
        if (dir === '←' && current % 3 === 0) break;

        current = next;
    }

    return path;
}

function rotatePath(path) {
    path.forEach(i => {
        let idx = rotations.indexOf(board[i]);
        board[i] = rotations[(idx + 1) % 4];
    });
}

function handleClick(index, btn) {
    let path = getPath(index);

    rotatePath(path);

    // 애니메이션
    btn.classList.add("rotate");
    setTimeout(() => btn.classList.remove("rotate"), 300);

    updateStatus(path);
    checkWin();
    render();
}

function updateStatus(path) {
    document.getElementById("status").innerText =
        "경로: " + path.map(i => i+1).join(" → ");
}

function checkWin() {
    if (board.every(cell => cell === '→')) {
        document.getElementById("status").innerText = "🎉 클리어!";
    }
}

function resetGame() {
    board = [
        '↓','→','←',
        '↑','↓','←',
        '→','↑','←'
    ];
    document.getElementById("status").innerText = "초기화 완료";
    render();
}

function shuffle() {
    const dirs = ['↑','→','↓','←'];
    board = board.map(() => dirs[Math.floor(Math.random()*4)]);
    document.getElementById("status").innerText = "랜덤 생성";
    render();
}

render();
</script>

</body>
</html>
